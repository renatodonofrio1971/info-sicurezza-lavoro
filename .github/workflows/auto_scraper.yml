name: Scraper Notturno Info Sicurezza

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: 

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Accedi al codice del repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa le librerie necessarie
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: Esegui lo Scraper
      run: python scraper.py

    - name: Salva e aggiorna il Database CSV su GitHub
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add Database_Notizie.csv
        git commit -m "Aggiornamento automatico database notizie [Skip CI]" || exit 0
        git push

    - name: Invia i dati aggiornati a Glide
      env:
        GLIDE_APP_ID: ${{ secrets.GLIDE_APP_ID }}
        GLIDE_API_TOKEN: ${{ secrets.GLIDE_API_TOKEN }}
      run: |
        python -c "
        import pandas as pd
        import requests
        import json
        import os

        df = pd.read_csv('Database_Notizie.csv')
        # Prende le ultime notizie o quelle caricate oggi
        rows = df.tail(10).to_dict(orient='records')
        
        payload = {'rows': rows}
        headers = {
            'Content-Type': 'application/json',
            'Authorization': f'Bearer {os.environ[\"GLIDE_API_TOKEN\"]}'
        }
        url = f'https://glideapp.io{os.environ[\"GLIDE_APP_ID\"]}/tables/news/add-rows'
        
        response = requests.post(url, headers=headers, data=json.dumps(payload))
        print('Risposta Glide:', response.status_code, response.text)
        "
